<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expense Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h2 th:text="${expense.id == null} ? 'Add Expense' : 'Edit Expense'"></h2>
<form th:action="@{/save}" th:object="${expense}" method="post" class="form">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
        <label>Name:</label>
        <input type="text" th:field="*{name}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Amount:</label>
        <input type="number" th:field="*{amount}" step="0.01" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Category:</label>
        <input type="text" th:field="*{category}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Date:</label>
        <input type="date" th:field="*{date}" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
